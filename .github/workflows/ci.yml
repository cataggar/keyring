name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

permissions:
  contents: read
  attestations: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.9.1
          tools: >-
            cataggar/zig@v0.17.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Verify Zig version
        shell: bash
        run: |
          version="$(zig version)"
          echo "Zig version: $version"
          test "$version" = "0.17.0"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dbus libsecret-1-dev python3-cryptography
      - name: Build
        run: zig build
      - name: Test
        run: zig build test
      - name: Test headless Linux behavior
        if: runner.os == 'Linux'
        run: bash tests/headless_linux.sh
      - name: Test WebAuthn Secret Service flow
        if: runner.os == 'Linux'
        run: bash tests/webauthn_service_integration.sh

  static-linux:
    name: Static ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl

    steps:
      - uses: actions/checkout@v4
      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@a3be8c61b9d5c2bd6d38e6d067c69d70434a6db9 # v0.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.9.1
          tools: >-
            cataggar/zig@v0.17.0
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
      - name: Verify Zig version
        shell: bash
        run: |
          version="$(zig version)"
          echo "Zig version: $version"
          test "$version" = "0.17.0"
      - name: Build
        run: zig build -Doptimize=safe -Dtarget=${{ matrix.target }}
      - name: Verify static binary
        run: bash tests/verify_static_elf.sh zig-out/bin/keyring
      - name: Smoke test
        run: ./zig-out/bin/keyring version
