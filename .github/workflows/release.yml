name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read
  attestations: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
            zig_target: x86_64-linux-musl
            binary: keyring
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl
            zig_target: aarch64-linux-musl
            binary: keyring
          - os: macos-latest
            target: aarch64-macos
            zig_target: native
            binary: keyring
          - os: macos-15-intel
            target: x86_64-macos
            zig_target: native
            binary: keyring
          - os: windows-latest
            target: x86_64-windows
            zig_target: x86_64-windows
            binary: keyring.exe
          - os: windows-latest
            target: aarch64-windows
            zig_target: aarch64-windows
            binary: keyring.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@6f3b25f2091c648162dbd0b9b5fff0d79b7fb364 # v0.10.3
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          ghr-version: v0.10.3
          tools: >-
            cataggar/zig@v0.17.1
            RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Verify Zig version
        shell: bash
        run: |
          version="$(zig version)"
          echo "Zig version: $version"
          test "$version" = "0.17.1"

      - name: Stamp version in build.zig.zon
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version from tag '${GITHUB_REF_NAME}': '$version'" >&2
            exit 1
          fi
          awk -v ver="$version" '!done && sub(/\.version = "[^"]*"/, ".version = \"" ver "\"") { done = 1 } { print } END { if (!done) exit 1 }' build.zig.zon > build.zig.zon.tmp
          mv build.zig.zon.tmp build.zig.zon
          grep -Fq ".version = \"$version\"" build.zig.zon

      - name: Build
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.zig_target }}" = "native" ]; then
            zig build -Doptimize=safe -Dversion="$version"
          else
            zig build -Doptimize=safe -Dtarget=${{ matrix.zig_target }} -Dversion="$version"
          fi
          if [ "${{ matrix.zig_target }}" != "aarch64-windows" ]; then
            actual="$("./zig-out/bin/${{ matrix.binary }}" version | tr -d '\r')"
            echo "Built binary version: $actual"
            test "$actual" = "keyring $version"
          fi

      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/verify_static_elf.sh "zig-out/bin/${{ matrix.binary }}"

      - name: Package binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          artifact="keyring-${{ github.ref_name }}-${{ matrix.target }}"
          cp "zig-out/bin/${{ matrix.binary }}" "$artifact"

      - name: Package binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifact = "keyring-${{ github.ref_name }}-${{ matrix.target }}.exe"
          Copy-Item "zig-out/bin/${{ matrix.binary }}" $artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keyring-${{ matrix.target }}
          path: |
            keyring-${{ github.ref_name }}-${{ matrix.target }}*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Log release tag
        run: echo "Releasing ${{ github.ref_name }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: keyring-*
          merge-multiple: true
          path: ./dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          cat > release-notes.txt <<NOTES
          **Install:**

          \`\`\`
          ghr install cataggar/keyring@${tag}
          \`\`\`
          NOTES

          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease)
          else
            release_flags=(--latest --prerelease=false)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            existing_body="$(gh release view "${GITHUB_REF_NAME}" --json body -q .body)"
            edit_flags=(--title "keyring ${version}" "${release_flags[@]}")
            if [[ -z "${existing_body//[[:space:]]/}" ]]; then
              edit_flags+=(--notes-file release-notes.txt)
            fi
            gh release edit "${GITHUB_REF_NAME}" "${edit_flags[@]}"
            gh release upload "${GITHUB_REF_NAME}" ./dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" ./dist/* \
              --title "keyring ${version}" \
              --notes-file release-notes.txt \
              "${release_flags[@]}"
          fi
